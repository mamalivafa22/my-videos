name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libdrm2 libgbm1 libxkbcommon0 libxrandr2 libxss1 libgtk-3-0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HyperFrames
        run: npm install -g hyperframes

      - name: Install browser
        run: npx hyperframes browser ensure

      - name: Render video
        run: |
          npx hyperframes render index.html \
            --output final_video.mp4 \
            --resolution 1280x720 \
            --fps 30 \
            --duration 10

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: final_video.mp4
